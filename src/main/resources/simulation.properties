# ==========================================
# MAP & RUNNER
# ==========================================
map.rows=30
map.columns=15
simulation.moveDelayMs=1000
# ==========================================
# ENGINE PRESETS
# ==========================================
pathfinder.algorithm=bfs
spawn.preset=default
# ==========================================
# SPAWN RATES (%)
# ==========================================
spawn.default.predatorPercent=5
spawn.default.herbivorePercent=8
spawn.default.herbivoreResourcePercent=20
spawn.default.rockPercent=10
spawn.default.treePercent=10
# ==========================================
# BALANCE: PREDATOR [min, max)
# ==========================================
entity.predator.speed.min=3
entity.predator.speed.max=5
entity.predator.health.min=2
entity.predator.health.max=5
entity.predator.damage.min=1
entity.predator.damage.max=4
# ==========================================
# BALANCE: HERBIVORE [min, max)
# ==========================================
entity.herbivore.speed.min=1
entity.herbivore.speed.max=3
entity.herbivore.health.min=5
entity.herbivore.health.max=9
# ==========================================
# MECHANICS
# ==========================================
creature.reproduction.pointsLimit=3
creature.hunger.initial=5
creature.hunger.maxSaturation=10
action.reproduction.threshold=5
# ==========================================
# SPRITES
# ==========================================
sprite.predator=\uD83E\uDD8A
sprite.herbivore=\uD83D\uDC14
sprite.herbivoreResource=\uD83C\uDF31
sprite.floor=\uD83D\uDFEB
sprite.rock=\uD83E\uDEA8
sprite.tree=\uD83C\uDF33